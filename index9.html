<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>家庭财富 AI Agent V1.8</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{

font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;

background:#f5f7fb;

padding:20px;

margin:0;

}

.container{

max-width:750px;

margin:auto;

}

.card{

background:white;

padding:20px;

margin-bottom:18px;

border-radius:16px;

box-shadow:0 4px 12px rgba(0,0,0,.08);

}

input{

width:100%;

padding:12px;

margin:7px 0;

box-sizing:border-box;

border-radius:8px;

border:1px solid #ccc;

font-size:16px;

}

button{

width:100%;

padding:14px;

border:none;

border-radius:10px;

background:#2563eb;

color:white;

font-size:17px;

margin-top:10px;

}

.result{

line-height:1.8;

}

canvas{

max-width:100%;

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>🏦 家庭财富 AI Agent</h1>

<p>

家庭私人 CFO 财富管理系统 V1.8

</p>

</div>

<div class="card">

<h2>👤 家庭信息</h2>

年龄：

<input id="age" type="number">

退休年龄：

<input id="retire" type="number">

目标退休资产：

<input id="target" type="number">

</div>

<div class="card">

<h2>💰 现金流</h2>

年收入：

<input id="income" type="number">

年支出：

<input id="expense" type="number">

</div>

<div class="card">

<h2>📊 家庭资产</h2>

股票 / ETF：

<input id="stock" type="number">

债券：

<input id="bond" type="number">

现金：

<input id="cash" type="number">

房产：

<input id="house" type="number">

<button onclick="analyze()">

生成 AI 财富报告

</button>

</div>
<div class="card">

<h2>📊 财富分析</h2>

<div id="result" class="result">

等待分析

</div>

</div>

<div class="card">

<h2>📈 未来资产走势图</h2>

<canvas id="trendChart"></canvas>

</div>

<div class="card">

<h2>📄 财富报告</h2>

<div id="report" class="result">

等待生成

</div>

<button onclick="printReport()">

打印 / 保存PDF报告

</button>

</div>

<script>

function money(x){

return "¥" + Math.round(x).toLocaleString();

}

let trendChart;

let reportText="";

function analyze(){

let age =

Number(document.getElementById("age").value)||0;

let retire =

Number(document.getElementById("retire").value)||65;

let target =

Number(document.getElementById("target").value)||0;

let income =

Number(document.getElementById("income").value)||0;

let expense =

Number(document.getElementById("expense").value)||0;

let stock =

Number(document.getElementById("stock").value)||0;

let bond =

Number(document.getElementById("bond").value)||0;

let cash =

Number(document.getElementById("cash").value)||0;

let house =

Number(document.getElementById("house").value)||0;

let total =

stock+bond+cash+house;

let invest =

stock+bond;

let saving =

income-expense;

let savingRate =

income>0 ? saving/income*100 : 0;

// 风险等级

let stockRate =

total>0 ? stock/total*100 : 0;

let risk;

if(stockRate>70){

risk="进取型";

}

else if(stockRate>40){

risk="平衡型";

}

else{

risk="保守型";

}

// 目标达成

let goalRate =

target>0 ? total/target*100 : 0;

if(goalRate>100){

goalRate=100;

}

document.getElementById("result").innerHTML=

`

<b>家庭净资产：</b>

${money(total)}

<br><br>

投资资产：

${money(invest)}

<br>

年度储蓄：

${money(saving)}

<br>

储蓄率：

${savingRate.toFixed(1)}%

<br><br>

风险等级：

<b>${risk}</b>

<br>

退休目标完成度：

${goalRate.toFixed(1)}%

`;

// 未来10年趋势

let years=[];

let values=[];

let future=total;

for(let i=0;i<=10;i++){

years.push(i+"年");

values.push(Math.round(future));

future=future*1.05+Math.max(saving,0);

}

if(trendChart){

trendChart.destroy();

}

trendChart=new Chart(

document.getElementById("trendChart"),

{

type:"line",

data:{

labels:years,

datasets:[{

label:"预计家庭资产",

data:values

}]

},

options:{

responsive:true

}

}

);
  // 生成财富报告

reportText=

`

🏦 家庭财富 AI Agent 报告

====================

家庭净资产：

${money(total)}

投资资产：

${money(invest)}

现金：

${money(cash)}

房产：

${money(house)}

年度储蓄：

${money(saving)}

储蓄率：

${savingRate.toFixed(1)}%

风险等级：

${risk}

退休目标完成度：

${goalRate.toFixed(1)}%

AI财富建议：

${

risk=="进取型"

?

"股票比例较高，建议关注市场波动，并建立安全资产。"

:

risk=="平衡型"

?

"资产结构较合理，可继续保持长期投资策略。"

:

"资产较稳健，但需关注长期增长能力。"

}

`;

document.getElementById("report").innerHTML =

reportText;

// 保存数据

let saveData={

age,

retire,

target,

income,

expense,

stock,

bond,

cash,

house

};

localStorage.setItem(

"wealthAI_V18",

JSON.stringify(saveData)

);

}

// 打印保存PDF

function printReport(){

window.print();

}

// 自动读取数据

window.onload=function(){

let saved =

localStorage.getItem("wealthAI_V18");

if(saved){

let d =

JSON.parse(saved);

document.getElementById("age").value =

d.age || "";

document.getElementById("retire").value =

d.retire || "";

document.getElementById("target").value =

d.target || "";

document.getElementById("income").value =

d.income || "";

document.getElementById("expense").value =

d.expense || "";

document.getElementById("stock").value =

d.stock || "";

document.getElementById("bond").value =

d.bond || "";

document.getElementById("cash").value =

d.cash || "";

document.getElementById("house").value =

d.house || "";

}

}

</script>

</body>

</html>
