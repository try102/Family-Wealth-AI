<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>家庭财富 AI Agent V1.4</title>

<style>

body{

font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;

background:#f5f7fb;

padding:20px;

margin:0;

}

.container{

max-width:700px;

margin:auto;

}

.card{

background:white;

padding:20px;

margin-bottom:18px;

border-radius:16px;

box-shadow:0 4px 12px rgba(0,0,0,.08);

}

input{

width:100%;

box-sizing:border-box;

padding:12px;

margin:6px 0;

border-radius:8px;

border:1px solid #ccc;

font-size:16px;

}

button{

width:100%;

padding:14px;

border:0;

border-radius:10px;

background:#2563eb;

color:white;

font-size:17px;

}

.result{

line-height:1.8;

}

.bar{

height:18px;

background:#ddd;

border-radius:10px;

overflow:hidden;

}

.fill{

height:100%;

background:#2563eb;

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>🏦 家庭财富 AI Agent</h1>

<p>

智能家庭财富管理与 AI 顾问 V1.4

</p>

</div>

<div class="card">

<h2>👨‍👩‍👧 家庭信息</h2>

年龄：

<input id="age" type="number">

退休年龄：

<input id="retire" type="number">

</div>

<div class="card">

<h2>💰 现金流</h2>

年收入：

<input id="income" type="number">

年支出：

<input id="expense" type="number">

</div>

<div class="card">

<h2>📊 资产输入</h2>

美股/ETF：

<input id="us" type="number">

中国股票/基金：

<input id="cn" type="number">

债券：

<input id="bond" type="number">

现金：

<input id="cash" type="number">

房产：

<input id="house" type="number">

<button onclick="analyze()">

生成财富报告

</button>

</div>

<div class="card">

<h2>📈 财富仪表盘</h2>

<div id="dashboard" class="result">

等待数据

</div>

</div>
<div class="card">

<h2>🤖 AI 财富分析</h2>

<div id="report" class="result">

等待分析

</div>

</div>

<div class="card">

<h2>📉 风险压力测试</h2>

<div id="risk" class="result">

等待分析

</div>

</div>

<div class="card">

<h2>📄 财富报告</h2>

<div id="summary" class="result">

生成后显示报告摘要

</div>

</div>

<script>

function money(x){

return "¥" + Math.round(x).toLocaleString();

}

function analyze(){

let age =

Number(document.getElementById("age").value)||0;

let retire =

Number(document.getElementById("retire").value)||65;

let income =

Number(document.getElementById("income").value)||0;

let expense =

Number(document.getElementById("expense").value)||0;

let us =

Number(document.getElementById("us").value)||0;

let cn =

Number(document.getElementById("cn").value)||0;

let bond =

Number(document.getElementById("bond").value)||0;

let cash =

Number(document.getElementById("cash").value)||0;

let house =

Number(document.getElementById("house").value)||0;

let stock =

us+cn;

let invest =

stock+bond;

let total =

invest+cash+house;

let saving =

income-expense;

let rate =

income>0 ? saving/income*100 : 0;

// 财富仪表盘

document.getElementById("dashboard").innerHTML=

`

<b>家庭净资产：</b>

${money(total)}

<br><br>

<b>投资资产：</b>

${money(invest)}

<br>

<b>现金：</b>

${money(cash)}

<br>

<b>房产：</b>

${money(house)}

<br><br>

资产结构：

<br><br>

股票：

${(stock/total*100||0).toFixed(1)}%

<div class="bar">

<div class="fill" style="width:${stock/total*100}%"></div>

</div>

<br>

债券：

${(bond/total*100||0).toFixed(1)}%

<br>

现金：

${(cash/total*100||0).toFixed(1)}%

<br>

房产：

${(house/total*100||0).toFixed(1)}%

`;

// AI评分

let score=70;

if(cash/total>0.1)

score+=10;

if(rate>20)

score+=10;

if(stock/total<0.7)

score+=10;

if(score>100)

score=100;

document.getElementById("report").innerHTML=

`

<h3>

财富健康评分：${score}/100

</h3>

<b>AI分析：</b>

<br><br>

${

cash/total<0.1

?

"现金储备偏低，建议增加流动资金。"

:

"现金安全垫较好。"

}

<br><br>

${

stock/total>0.7

?

"股票资产比例较高，需要关注市场波动。"

:

"投资风险相对可控。"

}

<br><br>

${

rate>20

?

"家庭储蓄能力优秀。"

:

"建议提高储蓄率。"

}

`;
  // 风险压力测试

let loss10 =

stock*0.1;

let loss20 =

stock*0.2;

let loss30 =

stock*0.3;

document.getElementById("risk").innerHTML =

`

市场下跌模拟：

<br><br>

📉 下跌10%

预计减少：

${money(loss10)}

<br><br>

📉 下跌20%

预计减少：

${money(loss20)}

<br><br>

📉 下跌30%

预计减少：

${money(loss30)}

<br><br>

如果接近退休年龄，应降低过高股票集中度。

`;

// 退休简单预测

let years =

retire-age;

if(years<0){

years=0;

}

let future =

total*Math.pow(1.05,years);

let supportYears =

expense>0 ? future/expense : 0;

// 财富报告摘要

document.getElementById("summary").innerHTML =

`

🏦 家庭财富报告

<br><br>

当前资产：

${money(total)}

<br>

投资资产：

${money(invest)}

<br>

年度储蓄：

${money(saving)}

<br>

储蓄率：

${rate.toFixed(1)}%

<br><br>

预计退休时资产：

${money(future)}

<br>

按当前支出水平：

约可支持：

${supportYears.toFixed(1)} 年

<br><br>

生成建议：

<br>

${

supportYears<30

?

"建议进一步提高退休资金安全边际。"

:

"退休资金基础较稳健。"

}

`;

// 保存数据到本地浏览器

let data={

age,

retire,

income,

expense,

us,

cn,

bond,

cash,

house

};

localStorage.setItem(

"familyWealthAI",

JSON.stringify(data)

);

}

// 自动恢复数据

window.onload=function(){

let saved =

localStorage.getItem("familyWealthAI");

if(saved){

let d =

JSON.parse(saved);

document.getElementById("age").value=d.age||"";

document.getElementById("retire").value=d.retire||"";

document.getElementById("income").value=d.income||"";

document.getElementById("expense").value=d.expense||"";

document.getElementById("us").value=d.us||"";

document.getElementById("cn").value=d.cn||"";

document.getElementById("bond").value=d.bond||"";

document.getElementById("cash").value=d.cash||"";

document.getElementById("house").value=d.house||"";

}

}

</script>

</body>

</html>
